# This Ingress does NOTHING until the AWS Load Balancer Controller is
# installed in the cluster (next step, requires IRSA set up first via
# eks-cluster/'s new OIDC provider). Once the controller is running, it
# watches for Ingress resources with ingressClassName: alb and provisions
# a real AWS Application Load Balancer automatically.
#
# HTTPS/ACM certificate wiring is intentionally left out for now — we'll
# add `alb.ingress.kubernetes.io/certificate-arn` once a domain + ACM cert
# are ready. For now this serves plain HTTP so we can verify the ALB path
# end-to-end first.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flask-ingress
  namespace: flask
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-2:933313868671:certificate/9da0f4d5-e1fd-4522-b339-0ee20e09d12e"
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'

spec:
  ingressClassName: alb
  rules:
    - host: app.lucktales.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ssl-redirect
                port:
                  name: use-annotation
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flask-service
                port:
                  number: 80

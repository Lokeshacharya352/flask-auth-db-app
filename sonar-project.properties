# sonar-project.properties
#
# Fill in sonar.organization and sonar.projectKey with the exact values
# SonarCloud shows you when you import the repo (Administration -> General
# Settings on the project, or the setup wizard).

sonar.organization=lokeshacharya352
sonar.projectKey=flask-auth-db-app

# Only scan the actual application code - not Terraform, Kubernetes
# manifests, or virtual environments, which aren't what a code-quality
# scanner is meant to analyze anyway.
sonar.sources=app,run.py
sonar.exclusions=terraform/**,terraform-backend/**,eks-cluster/**,k8s/**,venv/**,.venv/**,**/__pycache__**